# GitHub Actions — CI re-derives every gate from the pushed branch.
# Ticket branches (ticket/NN-slug) must be shipped (ticket in tickets/closed/)
# and pass gate.sh pr. Other branches run the environment gates only; any
# change to a MEDIUM/HIGH path there fails env-lint --protected-diff.

name: agentic-gates

on:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # the branch as pushed, not the merge commit
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Base branch
        run: |
          base="$(awk '/^base_branch:/{print $2; exit}' .agentic/config.yml)"
          if [ "${{ github.base_ref }}" != "$base" ]; then
            echo "::warning::PR targets '${{ github.base_ref }}' but config base_branch is '$base'"
          fi

      - name: env-lint
        run: scripts/env-lint.sh --protected-diff

      - name: ticket-lint
        run: scripts/ticket-lint.sh

      - name: floor-guard
        run: scripts/floor-guard.sh

      - name: verify
        run: scripts/verify.sh

      - name: debt-lint
        run: scripts/debt-lint.sh

      - name: model-check
        run: scripts/model-check.sh

      - name: audit
        run: |
          set -euo pipefail
          enabled="$(awk '/^audit:/{inb=1;next} inb && /^[^[:space:]#]/{inb=0} inb && /enabled:/{print $2; exit}' .agentic/config.yml)"
          when="$(awk '/^audit:/{inb=1;next} inb && /^[^[:space:]#]/{inb=0} inb && /^[[:space:]]+on:/{print $2; exit}' .agentic/config.yml)"
          cmd="$(awk '/^audit:/{inb=1;next} inb && /^[^[:space:]#]/{inb=0} inb && /command:/{sub(/^[[:space:]]*command:[[:space:]]*/,""); gsub(/"/,""); print; exit}' .agentic/config.yml)"
          fail_merge="$(awk '/^audit:/{inb=1;next} inb && /^[^[:space:]#]/{inb=0} inb && /fail_merge:/{print $2; exit}' .agentic/config.yml)"
          if [ "$enabled" != "true" ] || [ "$when" != "scheduled" ] || [ -z "$cmd" ]; then
            echo "audit: not run"
            exit 0
          fi
          set +e
          bash -c "$cmd"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$fail_merge" = "true" ]; then
            echo "audit: command failed"
            exit "$rc"
          fi
          echo "audit: command finished"
          exit 0

      - name: gate pr (ticket branches)
        run: |
          set -euo pipefail
          prefix="$(awk '/^branch_prefix:/{print $2; exit}' .agentic/config.yml)"
          NN="$(printf '%s' "$GITHUB_HEAD_REF" | sed -n "s#^${prefix:-ticket/}0*\([0-9][0-9]*\)-.*#\1#p")"
          if [ -z "$NN" ]; then
            echo "CI: '$GITHUB_HEAD_REF' is not a ticket branch — environment gates only."
            exit 0
          fi
          scripts/gate.sh pr "$NN" --require-shipped
