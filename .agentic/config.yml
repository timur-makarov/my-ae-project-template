# Agentic environment configuration — the single source of tunables.
# Scripts and hooks read this file; edit values here instead of editing skills.
# Keep the format flat (key: value, one extra level of nesting) — scripts parse it with awk.
# This file's risk floor is HIGH: loosening it goes through a HIGH ticket.

tracker: local-markdown        # local-markdown | github-issues

base_branch: main              # PRs target this branch
branch_prefix: ticket/         # a claim is a branch: ticket/NN-slug
worktree_dir: .worktrees       # gate.sh implement NN --worktree puts worktrees here (git-ignored)

models:
  planner: inherit
  implementer: inherit
  implementer_mechanical: inherit
  reviewer: inherit
  critic: inherit
  escalation: inherit

models_allowed:
  - inherit

risk:
  low_fast_lane: true          # LOW: no verify stamp, no reviewer — checks + ship
  high_requires_human_merge: true

# Risk floors: a ticket must be at least this tier to touch a matching path.
risk_paths:
  "migrations/**": HIGH
  "**/auth/**": HIGH
  "**/*payment*": HIGH
  "scripts/hooks/**": HIGH
  ".github/**": HIGH
  ".cursor/**": HIGH
  ".claude/settings.json": HIGH
  ".codex/**": HIGH
  ".agentic/config.yml": HIGH
  "scripts/**": MEDIUM

# false: no ticket needed to edit files (the template ships editable).
# true: file-tool writes need a claimed ticket, except ticketless_paths.
# A claimed ticket's frozen scope is enforced either way.
scope:
  strict: false

ticketless_paths:
  - "docs/**"

migrations_dir: migrations

verify:
  test: "scripts/selftest.sh"
  lint: "scripts/env-lint.sh"
  typecheck: ""
  e2e: ""

limits:
  max_active_tickets: 1        # in-progress tickets across local branches/worktrees
  stop_followups: 0            # stop hook re-prompts per run when next has agent work
  command_timeout_secs: 900    # per Check:/claim command
  context_md_max_lines: 120
  intake_strict: true
  max_scope_globs: 5
  require_worktree: false
  diff_warn_lines: 300
  diff_fail_lines: 0
  exception_max_days: 90
  lesson_ttl_days: 90

floor_guard: true
craft_skills: true

# Reviewer. Empty command = Mode A: the author starts a fresh seat on the brief.
# A command = Mode B: gate.sh runs it in a throwaway worktree; stdout is the report.
# The command reads $AGENTIC_BRIEF, $AGENTIC_PAYLOAD, and $AGENTIC_NN, and prints
# the report. Set once for the project. A ticket does not switch it.
critic:
  fanout: true                 # HIGH diff on a HIGH path: + security reviewer
  command: ""

audit:
  enabled: false
  command: ""
  on: manual
  fail_merge: false

# Agent-level restrictions. deny = blocked; ask = the tool prompts; allow = free.
# Pipe-to-interpreter and cloud metadata stay deny. Localhost is always allowed.
guard:
  network: allow               # shell fetches, WebFetch/WebSearch, MCP
  install_pipe: deny           # curl | sh and friends
  new_deps: allow              # package installs (the ticket's new_deps: is checked at ship)
  secrets: deny                # reading/writing .env, keys (.env.example is fine)
  commit_requires_nn: true     # commits on ticket/NN-* name NN
  privileged: deny             # --privileged, chmod 777, mkfs, dd of=/dev
  metadata: deny

floor_ignore:
  - "*.md"
  - "*.jsonl"
  - "vendor/**"
  - "scripts/selftest.sh"
  - "scripts/floor-guard.sh"

floor_exceptions:
